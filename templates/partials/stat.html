{% load ui %}
<div class="card-pad">
  <div class="flex items-start justify-between gap-2">
    <p class="stat-label">{{ label }}</p>
    {% if delta != None %}
      <span class="{{ delta|delta_class }} whitespace-nowrap">
        {% if delta > 0 %}&#8593;{% elif delta < 0 %}&#8595;{% endif %}
        {{ delta }}%
      </span>
    {% endif %}
  </div>
  <p class="stat-value">{{ value }}</p>
  <p class="mt-3 text-[11.5px] font-medium leading-snug text-zinc-700">{{ caption }}</p>
  {% if hint %}<p class="mt-0.5 text-[11px] leading-snug text-zinc-400">{{ hint }}</p>{% endif %}
</div>
