{% if messages %}
<div class="mb-4 space-y-2">
  {% for message in messages %}
    <div class="flex items-start gap-2.5 rounded-lg border px-3.5 py-2.5 text-[13px]
      {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800
      {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-900
      {% else %}border-zinc-200 bg-white text-zinc-700{% endif %}">
      <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full
        {% if message.tags == 'error' %}bg-red-500
        {% elif message.tags == 'warning' %}bg-amber-500
        {% else %}bg-zinc-400{% endif %}"></span>
      <p class="leading-relaxed">{{ message }}</p>
    </div>
  {% endfor %}
</div>
{% endif %}
