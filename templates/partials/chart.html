{% load ui %}
<div class="card">
  <div class="card-header">
    <div>
      <h2 class="text-[13px] font-semibold tracking-tight text-zinc-900">{{ chart_title|default:"Printing activity" }}</h2>
      <p class="mt-0.5 text-[11px] text-zinc-500">{{ chart_subtitle|default:"Pages printed per day" }}</p>
    </div>
    <div class="flex items-center gap-0.5 rounded-lg border border-zinc-200 bg-zinc-50 p-0.5">
      {% for option in range_options %}
        <a href="?range={{ option }}"
           class="nav-tab {% if option == range_days %}nav-tab-active{% endif %}">{{ option }}d</a>
      {% endfor %}
    </div>
  </div>

  <div class="px-4 pb-3 pt-4">
    <div class="flex items-baseline gap-2">
      <p class="text-[22px] font-semibold leading-none tracking-tight text-zinc-900">{{ chart.total }}</p>
      <p class="text-[11px] text-zinc-500">pages in the last {{ chart.days }} days</p>
    </div>

    <svg viewBox="0 0 760 190" preserveAspectRatio="none" class="mt-3 h-[190px] w-full" role="img"
         aria-label="Pages printed per day for the last {{ chart.days }} days">
      <defs>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#18181b" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <line x1="0" y1="20" x2="760" y2="20" stroke="#f4f4f5" stroke-width="1"/>
      <line x1="0" y1="95" x2="760" y2="95" stroke="#f4f4f5" stroke-width="1"/>
      <line x1="0" y1="170" x2="760" y2="170" stroke="#e4e4e7" stroke-width="1"/>

      {% chart_area chart.values as area_path %}
      {% chart_line chart.values as line_path %}
      <path d="{{ area_path }}" fill="url(#chartFill)"/>
      <path d="{{ line_path }}" fill="none" stroke="#18181b" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>

    <div class="mt-1 flex justify-between px-0.5 text-[10px] text-zinc-400">
      {% for label in chart.labels %}<span>{{ label.date }}</span>{% endfor %}
    </div>
  </div>
</div>
