{% extends "base.html" %}
{% block title %}Invitation link expired · ESprints{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center bg-zinc-100 px-4">
  <div class="w-full max-w-[460px] rounded-2xl border border-zinc-200 bg-white p-8 text-center shadow-sm">
    <span class="mx-auto grid h-10 w-10 place-items-center rounded-xl bg-amber-50 text-amber-700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
    </span>
    <h1 class="mt-4 text-[20px] font-bold tracking-tight">This link has expired</h1>
    <p class="mt-2 text-[13px] leading-relaxed text-zinc-500">
      Invitation links are valid for three days and can only be used once.
      Ask the society office to send you a new one.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary mt-6 w-full">Back to sign in</a>
  </div>
</div>
{% endblock %}
